[package]
name = "miv"
version = "0.3.0"
edition = "2021"
rust-version = "1.81"
description = "A modal terminal text editor"
license = "MIT"

[[bin]]
name = "miv"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.28", features = ["bracketed-paste"] }
ratatui = "0.29"
regex = "1.11"
ropey = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
toml = "0.8"
unicode-segmentation = "1.12"
unicode-width = "0.2"

[profile.release]
lto = true
codegen-units = 1

# A plugin is a directory with a plugin.toml in it. Copy this one to
# ~/.config/miv/plugins/secrets/ and `:b64decode` becomes a real command.
#
# This is the whole file: no code, no build step. A plugin that only needs to
# pipe text through a program does not need to be a program itself.

name = "secrets"
version = "0.1.0"
description = "Base64 for Kubernetes secret values"

# What the plugin is allowed to do. `:plugins` shows this, so installing
# something is an informed decision. A command that edits the buffer is
# refused at load time unless write_buffer is declared here.
capabilities = ["read_buffer", "write_buffer"]

[[command]]
name = "b64decode"
description = "Decode the selection"
# "filter" pipes the target through the command and replaces it with the
# output, as one undo step.
kind = "filter"
# "selection" is the visual selection, or the current line when there is none.
# Also "buffer" and "line".
target = "selection"
command = ["base64", "-d"]

[[command]]
name = "b64encode"
description = "Encode the selection"
kind = "filter"
target = "selection"
# `base64 -w0` on GNU; macOS wraps at no width by default.
command = ["base64"]

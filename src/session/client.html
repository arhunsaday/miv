<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>miv — shared session</title>
<style>
  :root {
    --bg: #14171c; --panel: #1b1f27; --line: #2a3039;
    --text: #d8dee9; --dim: #7d8799; --accent: #81a1c1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 700; letter-spacing: .04em; }
  .brand span { color: var(--dim); font-weight: 400; margin-left: 6px; }
  .who { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 2px 9px; border-radius: 999px;
    background: #232833; border: 1px solid var(--line); font-size: 12px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .badge {
    font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
    padding: 3px 8px; border-radius: 4px; background: #232833; color: var(--dim);
  }
  .badge.live { background: #2d4739; color: #a3be8c; }
  .badge.write { background: #3a3555; color: #b48ead; }
  .badge.down { background: #4a2f33; color: #bf616a; }
  main { flex: 1; display: grid; place-items: center; padding: 14px; min-height: 0; }
  #screen {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 14px; line-height: 1.3; white-space: pre; tab-size: 4;
    background: #0f1216; border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; box-shadow: 0 18px 50px rgba(0,0,0,.45);
    caret-color: transparent; outline: none;
  }
  #screen:focus { border-color: var(--accent); }
  .cell.cursor { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  footer {
    padding: 7px 14px; border-top: 1px solid var(--line);
    color: var(--dim); font-size: 12px; background: var(--panel);
    display: flex; gap: 10px; align-items: center;
  }
  kbd {
    background: #232833; border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 4px; padding: 0 5px; font-family: inherit; font-size: 11px;
  }
</style>

<header>
  <div class="brand">miv<span id="file">shared session</span></div>
  <span class="badge" id="access">connecting</span>
  <span class="badge" id="state">offline</span>
  <div class="who" id="who"></div>
</header>
<main><div id="screen" tabindex="0"></div></main>
<footer>
  <span id="hint">Click the screen, then type. Everything you press goes to the session.</span>
  <span style="margin-left:auto">Press <kbd>Esc</kbd> then <kbd>:</kbd><kbd>q</kbd> in your own view to leave</span>
</footer>

<script>
(() => {
  const TOKEN = "__MIV_TOKEN__";
  const PROTOCOL_VERSION = 1;
  const screenEl = document.getElementById("screen");
  const whoEl = document.getElementById("who");
  const stateEl = document.getElementById("state");
  const accessEl = document.getElementById("access");
  const fileEl = document.getElementById("file");
  const hintEl = document.getElementById("hint");

  let socket = null, cells = [], cols = 0, rows = 0, myId = null, access = "read";
  let cursor = null, reconnectDelay = 400;

  // xterm's 256-colour palette, so the browser shows what the terminal shows.
  const BASE16 = [
    [0x1c,0x1f,0x26],[0xbf,0x61,0x6a],[0xa3,0xbe,0x8c],[0xeb,0xcb,0x8b],
    [0x81,0xa1,0xc1],[0xb4,0x8e,0xad],[0x88,0xc0,0xd0],[0xd8,0xde,0xe9],
    [0x4c,0x56,0x6a],[0xd0,0x87,0x70],[0xb5,0xd0,0x9f],[0xf0,0xd8,0xa8],
    [0x9a,0xb8,0xd8],[0xc8,0xa2,0xc8],[0xa3,0xd8,0xe0],[0xec,0xef,0xf4],
  ];
  const LEVELS = [0,95,135,175,215,255];
  function indexed(i) {
    if (i < 16) return BASE16[i];
    if (i < 232) {
      const n = i - 16;
      return [LEVELS[Math.floor(n/36)%6], LEVELS[Math.floor(n/6)%6], LEVELS[n%6]];
    }
    const v = 8 + (i - 232) * 10;
    return [v,v,v];
  }
  function css(color, fallback) {
    if (!color || color.k === "default") return fallback;
    const [r,g,b] = color.k === "indexed" ? indexed(color.i) : [color.r,color.g,color.b];
    return `rgb(${r},${g},${b})`;
  }

  function measureCell() {
    const probe = document.createElement("span");
    probe.textContent = "M";
    probe.style.cssText = "position:absolute;visibility:hidden;font:inherit;";
    screenEl.appendChild(probe);
    const box = probe.getBoundingClientRect();
    probe.remove();
    return { w: box.width || 8, h: box.height || 18 };
  }

  function fitToWindow() {
    const { w, h } = measureCell();
    const main = document.querySelector("main").getBoundingClientRect();
    return {
      cols: Math.max(40, Math.min(220, Math.floor((main.width - 40) / w))),
      rows: Math.max(8, Math.min(80, Math.floor((main.height - 34) / h))),
    };
  }

  function buildGrid(c, r) {
    cols = c; rows = r; cells = [];
    screenEl.replaceChildren();
    for (let y = 0; y < r; y++) {
      const row = document.createElement("div");
      const line = [];
      for (let x = 0; x < c; x++) {
        const span = document.createElement("span");
        span.className = "cell";
        span.textContent = " ";
        row.appendChild(span);
        line.push(span);
      }
      screenEl.appendChild(row);
      cells.push(line);
    }
  }

  function paint(list) {
    for (const cell of list) {
      const row = cells[cell.y];
      if (!row) continue;
      const el = row[cell.x];
      if (!el) continue;
      el.textContent = cell.s === "" ? " " : cell.s;
      el.style.color = css(cell.f, "var(--text)");
      el.style.background = css(cell.b, "transparent");
      const m = cell.m || 0;
      el.style.fontWeight = (m & 1) ? "700" : "400";       // BOLD
      el.style.opacity    = (m & 2) ? ".55" : "1";          // DIM
      el.style.fontStyle  = (m & 4) ? "italic" : "normal";  // ITALIC
      el.style.textDecoration = (m & 8) ? "underline" : "none";
    }
  }

  function moveCursor(position) {
    if (cursor) cursor.classList.remove("cursor");
    cursor = null;
    if (!position) return;
    const [x, y] = position;
    const el = cells[y] && cells[y][x];
    if (el) { el.classList.add("cursor"); cursor = el; }
  }

  function renderRoster(participants) {
    whoEl.replaceChildren();
    for (const p of participants) {
      const chip = document.createElement("span");
      chip.className = "chip";
      const dot = document.createElement("span");
      dot.className = "dot";
      const [r,g,b] = indexed(p.color);
      dot.style.background = `rgb(${r},${g},${b})`;
      chip.appendChild(dot);
      chip.append(`${p.name}${p.is_host ? " (host)" : ""} · ${p.via} · ${p.mode.toLowerCase()} · L${p.line}`);
      whoEl.appendChild(chip);
      if (p.id === myId) fileEl.textContent = p.file;
    }
  }

  // Translate a browser key event into miv's own key notation.
  function encodeKey(event) {
    const named = {
      Escape: "Esc", Enter: "CR", Tab: "Tab", Backspace: "BS", Delete: "Del",
      ArrowLeft: "Left", ArrowRight: "Right", ArrowUp: "Up", ArrowDown: "Down",
      Home: "Home", End: "End", PageUp: "PageUp", PageDown: "PageDown",
    };
    const ctrl = event.ctrlKey, alt = event.altKey;
    if (named[event.key]) {
      const prefix = (ctrl ? "C-" : "") + (alt ? "A-" : "");
      return `<${prefix}${named[event.key]}>`;
    }
    if (event.key.length !== 1) return null;
    if (ctrl || alt) {
      const prefix = (ctrl ? "C-" : "") + (alt ? "A-" : "");
      return `<${prefix}${event.key.toLowerCase()}>`;
    }
    return event.key === "<" ? "<lt>" : event.key;
  }

  function setState(text, className) {
    stateEl.textContent = text;
    stateEl.className = "badge " + (className || "");
  }

  function connect() {
    const size = fitToWindow();
    buildGrid(size.cols, size.rows);
    setState("connecting");

    const scheme = location.protocol === "https:" ? "wss" : "ws";
    socket = new WebSocket(`${scheme}://${location.host}/ws`);

    socket.onopen = () => {
      reconnectDelay = 400;
      setState("live", "live");
      const name = localStorage.getItem("miv.name")
        || `web-${Math.random().toString(36).slice(2, 6)}`;
      localStorage.setItem("miv.name", name);
      socket.send(JSON.stringify({
        type: "hello", version: PROTOCOL_VERSION, token: TOKEN,
        name, cols: size.cols, rows: size.rows,
      }));
    };

    socket.onmessage = (event) => {
      const message = JSON.parse(event.data);
      if (message.type === "frame") {
        if (message.cols !== cols || message.rows !== rows) {
          buildGrid(message.cols, message.rows);
        }
        paint(message.cells);
        moveCursor(message.cursor);
      } else if (message.type === "welcome") {
        myId = message.id;
        access = message.access;
        accessEl.textContent = access === "write" ? "read-write" : "read-only";
        accessEl.className = "badge " + (access === "write" ? "write" : "");
        hintEl.textContent = access === "write"
          ? "Click the screen and type — your keys go straight into the shared buffer."
          : "Read-only. Ask the host to run :grant on your name for write access.";
        screenEl.focus();
      } else if (message.type === "roster") {
        renderRoster(message.participants);
      } else if (message.type === "notice") {
        hintEl.textContent = message.text;
      } else if (message.type === "closed") {
        setState(message.reason, "down");
        socket.close();
      }
    };

    socket.onclose = () => {
      setState("reconnecting", "down");
      setTimeout(connect, reconnectDelay);
      reconnectDelay = Math.min(reconnectDelay * 2, 8000);
    };
    socket.onerror = () => socket.close();
  }

  screenEl.addEventListener("keydown", (event) => {
    if (event.metaKey) return;           // leave browser shortcuts alone
    const keys = encodeKey(event);
    if (!keys) return;
    event.preventDefault();
    if (socket && socket.readyState === WebSocket.OPEN) {
      socket.send(JSON.stringify({ type: "keys", keys }));
    }
  });

  screenEl.addEventListener("paste", (event) => {
    const text = (event.clipboardData || window.clipboardData).getData("text");
    if (!text) return;
    event.preventDefault();
    if (socket && socket.readyState === WebSocket.OPEN) {
      socket.send(JSON.stringify({ type: "paste", text }));
    }
  });

  let resizeTimer = null;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const size = fitToWindow();
      if (size.cols === cols && size.rows === rows) return;
      buildGrid(size.cols, size.rows);
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({ type: "resize", cols: size.cols, rows: size.rows }));
      }
    }, 150);
  });

  connect();
})();
</script>
